name: Release
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: '--target x86_64-pc-windows-msvc'
          - os: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v0.1.0-${{ github.run_id }}
          releaseName: "GM Desk v0.1.0"
          releaseBody: "Nova compilação automatizada do GM Desk para Linux e Windows."
          releaseDraft: false
          prerelease: false
          includeRelease: false
          args: ${{ matrix.args }}

      - name: Encontrar e Renomear Portable (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          copy "src-tauri\target\x86_64-pc-windows-msvc\release\gmdesk.exe" "GM_Desk_Portable.exe"
        shell: cmd

      - name: Fazer Upload do Portable
        if: matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-${{ github.run_id }}
          files: GM_Desk_Portable.exe
